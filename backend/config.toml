# Supabase CLI configuration for the Cobotics backend.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "cobotics"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Captures outgoing emails (confirmation, recovery, magic link) locally.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# NOTE: [auth] here applies to LOCAL dev (supabase start). For the hosted
# project, set Site URL and Redirect URLs in the dashboard:
#   Authentication > URL Configuration
#     Site URL:      https://cobotics.vercel.app
#     Redirect URLs: https://cobotics.vercel.app/**, http://localhost:3000/**
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/verify",
  "http://localhost:3000/auth/reset",
  "https://cobotics.vercel.app/auth/verify",
  "https://cobotics.vercel.app/auth/reset",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Require email confirmation before sign-in.
enable_confirmations = true
# Use 6-digit OTP codes in emails (pairs with the frontend verify page).
otp_length = 6
otp_expiry = 3600
